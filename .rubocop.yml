inherit_mode:
  merge:
    - Exclude

require:
  - standard

plugins:
  - standard-custom
  - standard-performance
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-thread_safety

inherit_gem:
  standard: config/base.yml
  standard-performance: config/base.yml
  standard-custom: config/base.yml
  standard-rails: config/base.yml

AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - bin/**/*
    - db/**/*
    - vendor/**/*
    - tmp/**/*
    - log/**/*
    - storage/**/*
    - coverage/**/*
    - uploads/**/*
    - .git/**/*
    - node_modules/**/*
    - public/packs/**/*
    - public/packs-test/**/*
    - examples/**/*

# RSpec-specific configuration
RSpec/ExampleLength:
  Max: 80
  Exclude:
    - spec/benchmark/runtime_comparison_spec.rb
    - spec/integration/configurable_identity_spec.rb

RSpec/SpecFilePathFormat:
  Enabled: false
  Exclude:
    - spec/**/*

RSpec/HooksBeforeExamples:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 16

RSpec/NestedGroups:
  Max: 4

RSpec/RepeatedExample:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false
  Exclude:
    - spec/integration/**/*
    - spec/active_version/concerns_spec.rb

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/BeforeAfterAll:
  Exclude:
    - spec/**/*_spec.rb

RSpec/MultipleExpectations:
  Exclude:
    - spec/integration/**/*
    - spec/active_version/**/*_spec.rb
    - spec/benchmark/runtime_comparison_spec.rb

RSpec/InstanceVariable:
  Exclude:
    - spec/**/*
    - spec/active_version/audits/sql_builder_spec.rb
    - spec/active_version/revisions/sql_builder_spec.rb

RSpec/MessageSpies:
  Exclude:
    - spec/**/*
    - spec/active_version/instrumentation_spec.rb

RSpec/LeakyConstantDeclaration:
  Enabled: false

RSpec/RemoveConst:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: false

RSpec/BeEq:
  Exclude:
    - spec/**/*

RSpec/ExpectChange:
  Exclude:
    - spec/**/*

RSpec/ReceiveMessages:
  Exclude:
    - spec/**/*

RSpec/DescribedClass:
  Exclude:
    - spec/**/*

Rails/ApplicationRecord:
  Exclude:
    - spec/**/*

Rails/TimeZone:
  Exclude:
    - spec/**/*

ThreadSafety/NewThread:
  Exclude:
    - spec/**/*

Lint/ConstantDefinitionInBlock:
  Exclude:
    - spec/**/*
    - lib/active_version/revisions/revision_record.rb
    - lib/active_version/translations/translation_record.rb

Rails/Blank:
  Exclude:
    - lib/active_version/adapters/sequel/**/*

RSpec/NoExpectationExample:
  Exclude:
    - spec/integration/**/*_spec.rb

RSpec/RepeatedExampleGroupDescription:
  Exclude:
    - spec/active_version/column_mapper_spec.rb
    - spec/active_version/revisions/has_revisions_spec.rb

Lint/ShadowedException:
  Exclude:
    - lib/active_version/audits/audit_record.rb
    - lib/active_version/audits/audit_record/callbacks.rb

# Custom cop overrides
Style/AccessModifierDeclarations:
  EnforcedStyle: inline

Rails/ActiveRecordCallbacksOrder:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Lint/UselessAssignment:
  Enabled: false

Rails/Exit:
  Exclude:
    - usr/**/*

ThreadSafety/ClassAndModuleAttributes:
  Enabled: false

ThreadSafety/ClassInstanceVariable:
  Enabled: false

ThreadSafety/DirChdir:
  Exclude:
    - "*.gemspec"

# Strict cops that should never be disabled
Lint/Debugger:
  Enabled: true
  Exclude: []

RSpec/Focus:
  Enabled: true
  Exclude: []

Rails/Output:
  Enabled: true
  Exclude:
    - usr/**/*

Rails/FindEach:
  Enabled: true
  Exclude: []

Rails/UniqBeforePluck:
  Enabled: true
  Exclude: []

Metrics/ModuleLength:
  Enabled: true
  CountAsOne: [array, hash, heredoc, method_call]
  Max: 150
Metrics/ClassLength:
  Enabled: true
  CountAsOne: [array, hash, heredoc, method_call]
  Max: 150
Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 10
Metrics/PerceivedComplexity:
  Enabled: true
  Max: 10
Metrics/AbcSize:
  Enabled: true
  Max: 15
  CountRepeatedAttributes: false
