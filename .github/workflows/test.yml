name: test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run lint
        run: make lint

  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lock: Gemfile.lock
            ruby_version: "3.4"
          - lock: gemfiles/rails72.gemfile.lock
            ruby_version: "3.2"
          - lock: gemfiles/rails8ruby34.gemfile.lock
            ruby_version: "3.4"
          - lock: gemfiles/rails8ruby4.gemfile.lock
            ruby_version: "4.0"
          - lock: gemfiles/rails8truffleruby.gemfile.lock
            ruby_version: truffleruby

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
          cache-version: audit-${{ matrix.lock }}
      - name: Update advisory database
        if: matrix.lock == 'Gemfile.lock'
        run: bundle exec bundle audit check --update
      - name: Audit lockfile
        run: |
          lock="${{ matrix.lock }}"
          gemfile="${lock%.lock}"
          echo "==> ${gemfile}"
          BUNDLE_GEMFILE="${gemfile}" bundle install --quiet
          BUNDLE_GEMFILE="${gemfile}" bundle exec bundle audit check

  test:
    needs: [audit, quality]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - gemfile: rails72
            ruby_version: "3.2"
          - gemfile: rails8ruby34
            ruby_version: "3.4"
          - gemfile: rails8ruby4
            ruby_version: "4.0"
          - gemfile: rails8truffleruby
            ruby_version: "truffleruby"

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      DATABASE_URL: postgres://postgres@localhost:5432/active_version_test
      POLYRUN_COVERAGE_DISABLE: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: active_version_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
        bundler-cache: true

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Create shard databases for parallel RSpec
      run: ./script/create_postgres_shard_databases.sh

    - name: Run tests (parallel OS processes via polyrun)
      run: |
        ./bin/polyrun parallel-rspec --workers 5

  # One job: 5 RSpec processes on one runner + merged coverage + per-shard JSON for JUnit
  coverage-shard:
    needs: audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/active_version_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: active_version_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create shard databases for parallel RSpec
        run: ./script/create_postgres_shard_databases.sh

      - name: Run parallel RSpec with Polyrun coverage
        env:
          POLYRUN_COVERAGE: "1"
          POLYRUN_RSPEC_JSON: "1"
        run: |
          ./bin/polyrun parallel-rspec --workers 5 -- bundle exec rspec --format documentation

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: polyrun-coverage-parallel
          path: |
            coverage/merged.json
            coverage/polyrun-fragment-*.json
            tmp/rspec-*.json

  coverage-merge:
    needs: coverage-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: polyrun-coverage-parallel
          path: _artifacts
      - name: Merge coverage + JUnit for Codecov
        run: |
          set -euo pipefail
          test -f _artifacts/coverage/merged.json
          mkdir -p coverage
          cp _artifacts/coverage/merged.json coverage/polyrun-merged.json
          ./bin/polyrun report-coverage -i coverage/polyrun-merged.json -o coverage --basename coverage --format json,lcov,cobertura,console,html
          ./bin/polyrun report-junit -i "_artifacts/tmp/rspec-*.json" -o coverage/junit-coverage.xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          report_type: test_results
          files: coverage/junit-coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
