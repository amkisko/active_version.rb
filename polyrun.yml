version: 1

# Polyrun — shard env + spec list. spec/spec_paths.txt is written from paths_build before plan/run-shards (or: bundle exec polyrun build-paths).
# databases: supplies per-worker DATABASE_URL. This gem has no bin/rails, so start skips CloneShards migrate.
# Provision once: createdb active_version_test && bundle exec polyrun db:clone-shards --no-migrate --workers 5

databases:
  template_db: active_version_test
  shard_db_pattern: "active_version_test_%{shard}"
  postgresql:
    host: localhost
    username: postgres

start:
  databases: false

partition:
  suite: rspec
  paths_file: spec/spec_paths.txt
  shard_total: 5
  paths_build:
    all_glob: spec/**/*_spec.rb
    stages:
      - glob: spec/integration/**/*_spec.rb
        sort_by_substring_order:
          - revisions_spec
          - audits_spec
          - activerecord_compatibility
          - translations_spec
          - module_compatibility
        default_priority: 5
