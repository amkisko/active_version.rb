version: 1

hooks:
  before_suite:
    - bundle exec rubocop
    - bundle exec rbs validate

# Polyrun — shard env + spec list. spec/spec_paths.txt is written from paths_build before plan/run-shards (or: bundle exec polyrun build-paths).

partition:
  suite: rspec
  paths_file: spec/spec_paths.txt
  shard_total: 5
  paths_build:
    all_glob: spec/**/*_spec.rb
    stages:
      - glob: spec/integration/**/*_spec.rb
        sort_by_substring_order:
          - revisions_spec
          - audits_spec
          - activerecord_compatibility
          - translations_spec
          - module_compatibility
        default_priority: 5
